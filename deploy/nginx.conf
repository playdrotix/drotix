# Sample Nginx site for playdrotix.in (VPS). Change the paths to match your server, then reload Nginx.
# Apache users do not need this file: the included .htaccess does the same job.
server {
    listen 80;
    server_name playdrotix.in www.playdrotix.in;
    root /var/www/playdrotix.in;          # the folder where you uploaded the site files
    index index.html index.php;           # /faq/ opens /faq/index.html, /admin/login/ opens index.php
    charset utf-8;

    # private folders and files
    location ~ ^/(includes|database|deploy)/ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(sql|md|log|bak|sample)$ { deny all; }

    # App Links / Universal Links: exact files, JSON, no redirect
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # Private-room invite links: /join, /join/<CODE>, /join?code=<CODE> -> join/index.php (always 200)
    location ~ ^/join(/.*)?$ {
        include fastcgi_params;            # not fastcgi-php.conf: its try_files would 404 on /join/<CODE>
        fastcgi_param SCRIPT_FILENAME $document_root/join/index.php;
        fastcgi_param SCRIPT_NAME /join/index.php;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;

    # CSS and JS: short cache, so new styling is picked up within minutes
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }
    location ~* \.(png|jpg|jpeg|svg|ico|webp|woff2)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # PHP (forms /api/submit/ and the /admin/ panel)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;            # Ubuntu/Debian. On other systems use: include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;   # check your PHP version / socket name
    }
}
